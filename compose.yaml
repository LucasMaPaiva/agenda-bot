services:
  agenda-bot:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-2.0.0}
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
    container_name: agenda-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/agenda-bot.db
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    volumes:
      - ./data:/app/data
      - ./service-account.json:/run/secrets/google-service-account.json:ro
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    init: true
